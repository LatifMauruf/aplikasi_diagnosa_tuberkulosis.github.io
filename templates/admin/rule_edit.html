            <center><h2>Daftar Gejala</h2></center>
          </div>

 <main id="main">
   <!-- ======= Profil Section ======= -->
    
<section id="about" class="about">
    <div class="container" data-aos="fade-up">
      <div class="col-lg-8" style="margin: auto;">
        <h1>Edit Aturan Fuzzy</h1>
            <form method="POST">
                <label for="gejala">Gejala (dipisahkan koma, contoh: batuk, demam):</label><br>
                <input type="text" id="gejala" name="gejala" value="{{ rule[1] }}" required><br><br>

                <label for="kondisi">Kondisi (low/medium/high, urut seperti gejala):</label><br>
                <input type="text" id="kondisi" name="kondisi" value="{{ rule[2] }}" required><br><br>

                <label for="diagnosis">Diagnosis (paru/otak/kulit/tulang_punggung/hati):</label><br>
                <input type="text" id="diagnosis" name="diagnosis" value="{{ rule[3] }}" required><br><br>

                <button type="submit">Simpan</button>
                <a href="{{ url_for('admin_list_rules') }}">Batal</a>
            </form>
      </div>
    </div>
  </section>
